name: real-life-server

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reallifeserver
      POSTGRES_USER: reallifeserver
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reallifeserver"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mediamtx:
    # Custom-built (see deploy/mediamtx/Dockerfile): the official bluenviron/mediamtx image is
    # FROM scratch and has no shell/curl, which the runOnReady/runOnNotReady hooks below need.
    build:
      context: ./deploy/mediamtx
    restart: unless-stopped
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET in .env}
    volumes:
      - ./deploy/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "1935:1935" # RTMP ingest
      - "8890:8890/udp" # SRT ingest
      - "8889:8889" # WebRTC/WHIP
      - "8888:8888" # HLS (also proxied via nginx at /hls)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9997/v3/paths/list"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: src/RealLifeServer.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=reallifeserver;Username=reallifeserver;Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET in .env}
      KeyProtection__MasterKeyBase64: ${KEY_PROTECTION_MASTER_KEY:?set KEY_PROTECTION_MASTER_KEY in .env}
      Webhooks__Secret: ${WEBHOOK_SECRET}
      Discord__WebhookUrl: ${DISCORD_WEBHOOK_URL:-}
      MediaMtx__RtspBaseUrl: rtsp://mediamtx:8554
      MediaMtx__ApiBaseUrl: http://mediamtx:9997
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN:-http://localhost}
      SceneAssets__BrbVideoPath: /assets/scenes/brb.mp4
      SceneAssets__ReconnectingVideoPath: /assets/scenes/reconnecting.mp4
      SceneAssets__OfflineVideoPath: /assets/scenes/offline.mp4
      # TEMPORARY diagnostic for the DbUpdateConcurrencyException on POST .../destinations -
      # shows the actual SQL EF Core sends (parameter values are NOT logged, so no secrets leak).
      # Remove this line once the cause is confirmed.
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Information
    volumes:
      - ./deploy/assets/scenes:/assets/scenes:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-migrate:
    build:
      context: ./backend
      dockerfile: src/RealLifeServer.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=reallifeserver;Username=reallifeserver;Password=${POSTGRES_PASSWORD}"
    command: ["dotnet", "RealLifeServer.Api.dll", "--migrate"]
    restart: "no"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
      mediamtx:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro

volumes:
  postgres-data:
