# Reverse proxy / TLS termination described in docs/CONCEPT.md, chapter 11.3.
# TLS certificates (e.g. from certbot) are expected to be mounted at /etc/nginx/certs -
# see docker-compose.yml. This file assumes HTTPS is already available; swap the two
# `listen 443 ssl` server blocks for plain `listen 80` while testing locally without certs.

upstream api_upstream {
    server api:8080;
}

upstream frontend_upstream {
    server frontend:80;
}

upstream mediamtx_hls_upstream {
    server mediamtx:8888;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    # MediaMTX-only callbacks (auth/ready/not-ready). MediaMTX calls these directly over the
    # internal Docker network (http://api:8080/...) and never through this public proxy - block
    # them here so they are not reachable from the internet at all (docs/CONCEPT.md, chapter 10).
    location /api/webhooks/ {
        return 404;
    }

    # REST API
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR (WebSocket upgrade required)
    location /hubs/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # HLS preview segments, served by MediaMTX. MediaMTX's low-latency HLS muxer
    # (hlsVariant: lowLatency, mediamtx.yml) streams fMP4 chunks over long-lived, effectively
    # unbounded responses - nginx's default response buffering holds those chunks back instead
    # of forwarding them as they arrive, which is what left the preview player stuck at 0:00
    # with a black frame even though the manifest itself loaded fine. proxy_buffering off (plus
    # disabling any caching of what is inherently live, and using HTTP/1.1 so chunked transfer
    # works) fixes that.
    location /hls/ {
        proxy_pass http://mediamtx_hls_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-cache";
    }

    # Frontend SPA
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
    }
}
